[package]
name = "cannon"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
clap = {version = "4.6.7", features = ["derive"]}
futures-util = {version = "0.3.34", features = ["io"]}
percent-encoding = "2.3.2"
reqwest = {version = "0.13.5", features = ["query", "stream"]}
rusqlite = "0.41.1"
tokio = { version = "1", features = ["full"] }
tokio-util = {version = "0.7.20", features=["io"]}
uuid = {version = "1.29.0", features = ["v4"]}
xdg = "3.0.0"
